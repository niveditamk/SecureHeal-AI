name: SecureHeal-AI CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.13"

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          pip install hatchling
          pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check secureheal/ tests/
      - name: Ruff format check
        run: ruff format --check secureheal/ tests/
      - name: Mypy type check
        run: mypy secureheal/ --ignore-missing-imports

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          pip install hatchling
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest tests/ -v --tb=short
      - name: Run tests with coverage
        run: pytest tests/ --cov=secureheal --cov-report=term-missing

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t secureheal-ai:test .
      - name: Build Python target image
        run: docker build -t secureheal-target-python:test target_services/python_fastapi/
      - name: Build Java target image
        run: docker build -t secureheal-target-java:test target_services/java_spring_boot/
